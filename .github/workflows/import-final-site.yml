name: Importar site final

on:
  push:
    branches: [main]
    paths:
      - '.upload/**'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir pacote final
        run: |
          cat .upload/site-final.part-* > /tmp/site-final.zip
          unzip -t /tmp/site-final.zip

      - name: Extrair e substituir conteudo
        run: |
          TMPDIR=$(mktemp -d)
          unzip -q /tmp/site-final.zip -d "$TMPDIR"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$TMPDIR"/. ./

      - name: Commitar versao final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload final Castiel Bits site"
          git push
