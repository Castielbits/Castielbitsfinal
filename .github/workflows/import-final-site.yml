name: Importar site final

on:
  push:
    branches: [main]
    paths:
      - 'site-final.zip'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Validar pacote
        run: unzip -t site-final.zip

      - name: Extrair e substituir conteudo
        run: |
          TMPDIR=$(mktemp -d)
          unzip -q site-final.zip -d "$TMPDIR"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'site-final.zip' -exec rm -rf {} +
          cp -a "$TMPDIR"/. ./
          rm -f site-final.zip

      - name: Commitar versao final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload final Castiel Bits site"
          git push
